
name: SEO Build Check

on:
  push:
    branches:
      - fix/seo-audit-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          GEMINI_API_KEY: 'ci-placeholder-not-a-real-key'
          
